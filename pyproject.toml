	[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "softwaretestingklasifikator"
version = "0.10.3"
description = "Klasifikační aplikace pro předmět AP4TS (Testování SW) — UTB FAI."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Safronus" }]
dependencies = [
    "PySide6>=6.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-qt>=4.4",
    "ruff>=0.5",
    "openpyxl>=3.1",       # for one-shot import of historical .xlsx
]

[project.scripts]
klasifikator = "softwaretestingklasifikator.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
softwaretestingklasifikator = ["py.typed", "resources/*.png"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
